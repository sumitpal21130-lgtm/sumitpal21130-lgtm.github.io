<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumit C Lab - Online Compiler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }
    h2 {
      text-align: center;
      color: #00e676;
    }
    textarea {
      width: 100%;
      height: 220px;
      background-color: #1e1e1e;
      color: #00ff00;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #00e676;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #output {
      margin-top: 15px;
      background-color: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      min-height: 80px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Sumit C Lab</h2>

  <textarea id="code">#include &lt;stdio.h&gt;

int main() {
    printf("Hello Sumit! Welcome to C Lab.\n");
    return 0;
}</textarea>

  <button onclick="runCode()">Run Program</button>

  <h3>Output:</h3>
  <div id="output">यहाँ आपका आउटपुट दिखेगा...</div>

  <script>
    async function runCode() {
      const code = document.getElementById("code").value;
      const outputDiv = document.getElementById("output");
      outputDiv.innerText = "Running...";

      try {
        const response = await fetch("https://emkc.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            language: "c",
            version: "10.2.0",
            files: [{ content: code }]
          })
        });
        const data = await response.json();
        outputDiv.innerText = data.run.output || "No output";
      } catch (error) {
        outputDiv.innerText = "Error: " + error.message;
      }
    }
  </script>

</body>
</html>
