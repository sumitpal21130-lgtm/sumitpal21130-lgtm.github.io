<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumit C Lab - Online C Compiler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #1b1b1b;
      padding: 12px;
      text-align: center;
      border-bottom: 2px solid #00e676;
      flex-shrink: 0;
    }
    header h2 {
      color: #00e676;
      font-size: 20px;
      letter-spacing: 1px;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h2>Sumit C Lab</h2>
  </header>

  <iframe
    src="https://onecompiler.com"
    allow="clipboard-read; clipboard-write"
  ></iframe>

</body>
</html>
